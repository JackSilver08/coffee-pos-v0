name: Publish v1 source

on:
  push:
    branches: [v1]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check payload
        id: payload
        shell: bash
        run: |
          if [[ -f _release/v1-part-0.b64 && -f _release/v1-part-1.b64 && -f _release/v1-part-2.b64 && -f _release/v1-part-3.b64 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract v1
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          cat _release/v1-part-0.b64 _release/v1-part-1.b64 _release/v1-part-2.b64 _release/v1-part-3.b64 > /tmp/coffee-pos-v1.zip.b64
          base64 -d /tmp/coffee-pos-v1.zip.b64 > /tmp/coffee-pos-v1.zip
          mkdir /tmp/coffee-pos-v1
          unzip -q /tmp/coffee-pos-v1.zip -d /tmp/coffee-pos-v1
          cp -a /tmp/coffee-pos-v1/coffee-pos-v1/. ./
          rm -rf _release /tmp/coffee-pos-v1 /tmp/coffee-pos-v1.zip /tmp/coffee-pos-v1.zip.b64

      - name: Commit source
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: extract v1 source"
          git push
