name: Publish v1 source

on:
  push:
    branches: [v1]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check payload
        id: payload
        shell: bash
        run: |
          count=$(find _release -maxdepth 1 -type f -name 'v1z*.b64' 2>/dev/null | wc -l)
          if [[ "$count" -eq 10 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "payload files found: $count"
          fi

      - name: Rebuild v1 archive
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          cat             _release/v1z00             _release/v1z01             _release/v1z02             _release/v1z03             _release/v1z04             _release/v1z05             _release/v1z06             _release/v1z07             _release/v1z08             _release/v1z09             > /tmp/coffee-pos-v1.zip.b64
          base64 -d /tmp/coffee-pos-v1.zip.b64 > /tmp/coffee-pos-v1.zip
          mkdir /tmp/coffee-pos-v1
          unzip -q /tmp/coffee-pos-v1.zip -d /tmp/coffee-pos-v1
          cp -a /tmp/coffee-pos-v1/coffee-pos-v1/. ./
          rm -rf _release /tmp/coffee-pos-v1 /tmp/coffee-pos-v1.zip /tmp/coffee-pos-v1.zip.b64

      - name: Commit source
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: extract v1 source"
          git push
