name: Publish packaged v1 source

on:
  push:
    branches: [v1]

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message == 'ci: stage v1 payload 4'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild source archive
        run: |
          test -f _release/v1-part-0.b64
          test -f _release/v1-part-1.b64
          test -f _release/v1-part-2.b64
          test -f _release/v1-part-3.b64
          cat _release/v1-part-0.b64 _release/v1-part-1.b64 _release/v1-part-2.b64 _release/v1-part-3.b64 > _release/coffee-pos-v1.zip.b64
          base64 -d _release/coffee-pos-v1.zip.b64 > _release/coffee-pos-v1.zip

      - name: Extract packaged source
        run: |
          rm -rf .v1-extracted
          mkdir -p .v1-extracted
          unzip -q _release/coffee-pos-v1.zip -d .v1-extracted
          cp -a .v1-extracted/coffee-pos-v1/. ./
          rm -rf .v1-extracted _release

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "ci: extract v1 source"
          git push
